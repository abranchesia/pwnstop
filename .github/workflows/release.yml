name: release
on:
  push:
    tags: ["v*"]
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Trusted Publishing: PyPI trusts this workflow, no token stored
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uvx pytest -q
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
