name: New rule
description: A dangerous command or line pwnstop should catch and doesn't
labels: [new-rule]
body:
  - type: textarea
    id: what
    attributes:
      label: What it should catch
      description: The attack or the mistake, and where it was seen (an incident, a CVE, a write-up, an agent session).
    validations:
      required: true
  - type: textarea
    id: flagged
    attributes:
      label: Examples to flag
      description: Commands or lines, with the file name for code.
      render: text
    validations:
      required: true
  - type: textarea
    id: safe
    attributes:
      label: Look-alikes that are safe
      description: What the rule must let through, so it doesn't cry wolf.
      render: text
